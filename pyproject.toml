[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vericommit-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=1.68,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
vericommit-backend = "vericommit_backend.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vericommit_backend = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
